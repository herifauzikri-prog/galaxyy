<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semesta Abadi untuk Intan</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #btn-fs {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-size: 10px; backdrop-filter: blur(10px);
            text-transform: uppercase; letter-spacing: 2px;
        }

        .ui-overlay {
            position: fixed; bottom: 10%; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 500; pointer-events: none;
        }

        #btn-love {
            pointer-events: auto; cursor: pointer; 
            background: linear-gradient(45deg, #0a001a, #2b0000);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff;
            padding: 18px 35px; font-size: 0.85rem; letter-spacing: 3px;
            text-transform: uppercase; transition: all 0.4s ease; 
            backdrop-filter: blur(15px); border-radius: 50px; font-weight: bold; 
            box-shadow: 0 0 30px rgba(255, 0, 70, 0.3);
            width: 85%; max-width: 300px; text-align: center;
        }
    </style>
</head>
<body>

    <button id="btn-fs">Fullscreen</button>
    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <button id="btn-love">Lihat Inti Semesta</button>
    </div>

    <;audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let isHeart = false;
        let currentPhase = 0; 
        let flashIntensity = 0;
        const PARTICLE_COUNT = 30000; 

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 45, 140);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        
        // --- BLOOM OPTIMIZED (Mencegah Bulatan Solid) ---
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.5,  // Kekuatan sedang
            0.6,  // Radius sebaran lebih luas agar halus
            0.15  // Threshold lebih tinggi agar partikel di tengah tidak menyatu jadi satu lingkaran
        );
        composer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 2;
        controls.maxDistance = 1000;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.25;

        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const starTex = createCircleTexture();

        // NEBULA CLOUDS (Halus)
        const nebulaGroup = new THREE.Group();
        function createNebula() {
            const colors = [0x4400ff, 0xff0055, 0x0088ff];
            for(let i=0; i<12; i++) {
                const mat = new THREE.SpriteMaterial({ 
                    map: starTex, color: colors[i%3], transparent: true, opacity: 0.05, 
                    blending: THREE.AdditiveBlending, depthWrite: false 
                });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(120, 120, 1);
                sprite.position.set((Math.random()-0.5)*180, (Math.random()-0.5)*60, (Math.random()-0.5)*180);
                nebulaGroup.add(sprite);
            }
        }
        createNebula();
        scene.add(nebulaGroup);

        // TEKS SPRITES
        function createTextSprite(text, fontSize = 60) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.font = `300 ${fontSize}px "Segoe UI", Arial, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(255, 50, 100, 1)'; ctx.shadowBlur = 25;
            ctx.fillText(text, 512, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0, depthTest: false, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(30, 7.5, 1);
            sprite.renderOrder = 999;
            return sprite;
        }
        const s1 = createTextSprite("KIARA", 120);
        const s2 = createTextSprite("jaga kesehatan kamu", 70);
        const s3 = createTextSprite("Lopyuu🥰", 70);
        scene.add(s1, s2, s3);

        // GALAXY & HEART CORE
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const galDest = new Float32Array(PARTICLE_COUNT * 3);
        const heartDest = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        const galParams = { branches: 3, spin: 1.1, randomness: 0.2, insideColor: new THREE.Color('#ffcc88'), outsideColor: new THREE.Color('#4488ff') };

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 50;
            const branchAngle = (i % galParams.branches) / galParams.branches * Math.PI * 2;
            const spinAngle = radius * galParams.spin;
            const rX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * galParams.randomness * radius;
            const rY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * galParams.randomness * radius * 0.4;
            const rZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * galParams.randomness * radius;
            
            galDest[i3] = Math.cos(branchAngle + spinAngle) * radius + rX;
            galDest[i3+1] = rY;
            galDest[i3+2] = Math.sin(branchAngle + spinAngle) * radius + rZ;

            const t = Math.random() * Math.PI * 2;
            heartDest[i3] = 16 * Math.pow(Math.sin(t), 3) * 0.8;
            heartDest[i3+1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.8;
            heartDest[i3+2] = (Math.random() - 0.5) * 8;

            const mixedColor = galParams.insideColor.clone().lerp(galParams.outsideColor, radius / 50);
            colors[i3] = mixedColor.r; colors[i3+1] = mixedColor.g; colors[i3+2] = mixedColor.b;
            positions[i3] = galDest[i3]; positions[i3+1] = galDest[i3+1]; positions[i3+2] = galDest[i3+2];
            
            // Partikel di tengah dibuat lebih kecil agar tidak menumpuk cahaya (solid circle)
            sizes[i] = radius < 5 ? 0.15 : 0.35;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const galPoints = new THREE.Points(geometry, new THREE.PointsMaterial({ 
            size: 0.35, 
            map: starTex, 
            vertexColors: true, 
            blending: THREE.AdditiveBlending, 
            transparent: true, 
            depthWrite: false 
        }));
        scene.add(galPoints);

        // BACKGROUND STARS
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(3500 * 3);
        const bgCols = new Float32Array(3500 * 3);
        const starPallette = [new THREE.Color('#9bb2ff'), new THREE.Color('#ffffff'), new THREE.Color('#ffd2a1')];
        for(let i=0; i<3500; i++) {
            const i3 = i * 3;
            bgPos[i3] = (Math.random() - 0.5) * 1800; bgPos[i3+1] = (Math.random() - 0.5) * 1800; bgPos[i3+2] = (Math.random() - 0.5) * 1800;
            const c = starPallette[Math.floor(Math.random()*3)];
            bgCols[i3] = c.r; bgCols[i3+1] = c.g; bgCols[i3+2] = c.b;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCols, 3));
        const bgMat = new THREE.PointsMaterial({ size: 0.6, map: starTex, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        scene.add(new THREE.Points(bgGeo, bgMat));

        const meteors = [];
        function createMeteor() {
            const mGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,40,0)]);
            const mMat = new THREE.LineBasicMaterial({ color: 0xbbccff, transparent: true, opacity: 0.8 });
            const line = new THREE.Line(mGeo, mMat);
            line.position.set((Math.random()-0.5)*1200, 600, (Math.random()-0.5)*1200);
            line.rotation.z = Math.PI / 1.3;
            line.userData = { speed: 12 + Math.random() * 10 };
            scene.add(line);
            meteors.push(line);
        }
        setInterval(() => { if(meteors.length < 5) createMeteor(); }, 3000);

        // INTERACTION
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('btn-love');
        btn.onclick = () => {
            currentPhase = (currentPhase + 1) % 4;
            if (audio.paused) audio.play().catch(e => {});
            isHeart = (currentPhase > 0);
            flashIntensity = 1.8; 
            const labels = ["Lihat Inti Semesta", "Pesan Pertama", "Pesan Kedua", "Kembali ke Semesta"];
            btn.innerText = labels[currentPhase];
        };

        document.getElementById('btn-fs').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const pulse = Math.sin(time * 5) * 0.12 + 1.12;
            const beat = isHeart ? pulse : 1;

            if (flashIntensity > 0) flashIntensity -= 0.06;
            bloomPass.strength = 1.5 + flashIntensity;

            bgMat.opacity = 0.4 + Math.sin(time * 1.5) * 0.3;

            for(let i=meteors.length-1; i>=0; i--) {
                const m = meteors[i];
                m.position.y -= m.userData.speed; m.position.x -= m.userData.speed * 0.6;
                if(m.position.y < -600) { scene.remove(m); meteors.splice(i, 1); }
            }

            const p = geometry.attributes.position.array;
            const c = geometry.attributes.color.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                let tx, ty, tz, tCol;
                const radius = Math.sqrt(galDest[i3]**2 + galDest[i3+2]**2);
                if (isHeart) {
                    tx = heartDest[i3] * beat; ty = heartDest[i3+1] * beat; tz = heartDest[i3+2] * beat;
                    tCol = new THREE.Color('#ff0055');
                } else {
                    const rot = time * 0.12 * (8 / (radius + 15) + 0.32);
                    tx = galDest[i3] * Math.cos(rot) - galDest[i3+2] * Math.sin(rot); 
                    ty = galDest[i3+1]; 
                    tz = galDest[i3] * Math.sin(rot) + galDest[i3+2] * Math.cos(rot);
                    tCol = galParams.insideColor.clone().lerp(galParams.outsideColor, radius / 50);
                }
                p[i3] += (tx - p[i3]) * 0.05; p[i3+1] += (ty - p[i3+1]) * 0.05; p[i3+2] += (tz - p[i3+2]) * 0.05;
                c[i3] += (tCol.r - c[i3]) * 0.03; c[i3+1] += (tCol.g - c[i3+1]) * 0.03; c[i3+2] += (tCol.b - c[i3+2]) * 0.03;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            [s1, s2, s3].forEach((s, idx) => {
                const active = (currentPhase === idx + 1);
                s.material.opacity += ((active ? (0.6 + (beat-1.1)*4) : 0) - s.material.opacity) * 0.1;
                const ts = beat * 17 * (idx === 0 ? 1 : 1.5);
                s.scale.set(ts, ts/4, 1);
            });

            controls.update();
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
